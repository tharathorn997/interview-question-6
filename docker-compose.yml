version: '3.8'

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: product-mssql
    environment:
      SA_PASSWORD: "YourStrong@Passw0rd"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "YourStrong@Passw0rd" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: product-api
    ports:
      - "5001:5000"
    environment:
      ConnectionStrings__DefaultConnection: "Server=mssql,1433;Database=ProductManagement;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True;"
      ASPNETCORE_ENVIRONMENT: "Development"
    depends_on:
      mssql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: product-web
    ports:
      - "4200:80"
    depends_on:
      - backend-service

volumes:
  mssql-data:
